<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <!-- viewport-fit=cover lets the floodlight reach the screen edges;
       design.css then keeps content clear of the notch and the home
       indicator via the --sa-* tokens. -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Draft21</title>

  <!-- 📱 אייקונים לשמירה ב-Home Screen -->
  <link rel="icon" type="image/png" href="draft21icon.png">
  <link rel="apple-touch-icon" href="draft21icon.png">
  <link rel="apple-touch-icon" sizes="180x180" href="draft21icon.png">
  <link rel="icon" type="image/png" sizes="192x192" href="draft21icon.png">
  <link rel="icon" type="image/png" sizes="512x512" href="draft21icon.png">

  <!-- PWA - שם האפליקציה בהום סקרין -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Draft21">
  <meta name="application-name" content="Draft21">
  <meta name="theme-color" content="#06080B">
  <link rel="manifest" href="manifest.json">

  <!-- The whole visual system lives in one hand-written stylesheet.
       There is no CSS build step and no CDN: adding a class to
       script.js means adding it here too, on purpose. -->
  <link rel="stylesheet" href="design.css">
</head>
<body>
  <div id="connbar"></div>
  <div id="toasts" class="toasts" aria-live="polite"></div>
  <!-- Turn handovers are signalled by colour and motion; this is the same
       information for a screen reader. Visually hidden, never empty-checked. -->
  <div id="live" role="status" aria-live="assertive" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap"></div>

  <!-- First paint. Matches the real app's skeleton so the launch does
       not flash a different-looking screen before script.js runs. -->
  <div id="app">
    <div class="scr">
      <div class="wrap page center" style="flex:1">
        <div class="stack-16 t-center" style="width:100%;max-width:340px">
          <div class="brand center" style="gap:10px">
            <span class="brand__mark">21</span>
            <span class="t-h1" style="direction:ltr">Draft21</span>
          </div>
          <div class="skeleton" style="height:96px"></div>
          <div class="skeleton" style="height:56px"></div>
          <div class="skeleton" style="height:56px"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- Registered outside the module so the shell still gets cached even if the
       app script itself fails to start. -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('sw.js', { scope: './' }).catch(function () {});
      });
    }
  </script>

  <script type="module" src="script.js"></script>
</body>
</html>
